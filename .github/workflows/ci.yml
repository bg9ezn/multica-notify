name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make verify
        run: make verify

  integration:
    name: Integration tests (real ntfy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make test-integration
        run: make test-integration

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit carries Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          missing=$(git log --format='%H' "$base..HEAD" | while read -r hash; do
            if ! git show -s --format='%B' "$hash" | grep -qi 'Signed-off-by:'; then
              echo "$hash"
            fi
          done)
          if [ -n "$missing" ]; then
            echo "Commits missing Signed-off-by (git commit -s):"
            echo "$missing"
            exit 1
          fi
